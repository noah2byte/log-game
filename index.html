<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>로그: 열두 시진의 문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Gowun+Dodum&display=swap" rel="stylesheet">
</head>
<body>
<main>
  <h1>로그: 열두 시진의 문</h1>
  <p class="lede">이승과 저승 사이, 검은 해 아래 멈춘 연옥. 열두 시진의 문을 지키는 십이지신을 넘어 빼앗긴 그녀를 되찾는다.</p>
  <div class="stage"><canvas id="c" width="960" height="540" aria-label="로그 플랫포머 테스트 화면"></canvas></div>
  <ul class="keys">
    <li><kbd>←</kbd><kbd>→</kbd>이동</li>
    <li><kbd>Space</kbd>점프</li>
    <li><kbd>Z</kbd>공격</li>
    <li><kbd>X</kbd>랜턴</li>
    <li><kbd>C</kbd>무기 전환</li>
    <li><kbd>R</kbd>문 처음부터</li>
    <li><kbd>M</kbd>소리</li>
    <li><kbd>Esc</kbd>타이틀</li>
  </ul>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
